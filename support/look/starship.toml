# Don't print a new line at the start of the prompt
add_newline = false
# colours come from [palettes.colors] at the bottom, which Lucid repaints on
# every theme change
palette = 'colors'
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

# format = """
# $directory $fill $git_branch $cmd_duration
#  $character"""
format = """
$cmd_duration $directory$git_branch
  $character"""

[fill]
symbol = '-'
style = 'fg:color3'

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[ ](bold fg:color9)"
error_symbol = "[ ](bold fg:color3)"

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:color8"
symbol = "󰘬"
truncation_length = 12
truncation_symbol = ""
format = " 󰜥 [](bold fg:color8)[$symbol $branch(:$remote_branch)](fg:color2 bg:color8)[ ](bold fg:color8)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)](green)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[•$hostname](bg:color8 bold fg:color2)[](bold fg:color8)"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = true
format = '🕙[\[ $time \]]($style) '
time_format = "%T"

[username]
style_user = "bold bg:color8 fg:color2"
style_root = "red bold"
format = "[](bold fg:color8)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = " "
read_only = "  "
style = "bg:color1 fg:color2"
truncation_length = 2
truncation_symbol = ".../"
format = '[](bold fg:color1)[󰉋 → $path]($style)[](bold fg:color1)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "
"GitHub" = " 󰊤 "

[cmd_duration]
min_time = 0
format = '[](bold fg:color8)[󰪢 $duration](bold bg:color8 fg:color2)[](bold fg:color8)'

# repainted by Lucid on every theme change (~/.config/lucid/sync-starship.sh).
# only these values are rewritten, so the rest of this file stays yours
#   color1  primary, fixed dim   color4  surface container   color7  surface
#   color2  on primary           color5  on primary          color8  primary
#   color3  on surface variant   color6  surface dim         color9  primary
[palettes.colors]
color1 = '#5B85D1'
color2 = '#1e3050'
color3 = '#c7c5cc'
color4 = '#2d2049'
color5 = '#1e3050'
color6 = '#19102b'
color7 = '#19102b'
color8 = '#5B85D1'
color9 = '#5B85D1'
